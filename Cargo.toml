[package]
name = "cosmic-ext-applet-dict"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-only"
description = "An English dictionary applet for the COSMIC desktop."
repository = "https://github.com/cappsyco/cosmic-ext-applet-dict"

[dependencies]
i18n-embed-fl = "0.10.1"
rust-embed = "8.13.0"
sqlite = "0.37.4"
tokio = { version = "1", features = ["time"] }

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = ["applet", "applet-token", "wayland"]

[features]
flatpak = []

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
similar_names = "allow"
